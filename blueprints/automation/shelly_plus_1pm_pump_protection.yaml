blueprint:
  name: Shelly Plus 1PM Pump Protection
  description: >
    Synchronizes pump safety configuration to a Shelly Plus 1PM and manages
    weather-based frost protection.

    Requires TWO OpenWeatherMap integration instances using the non-subscription
    Free API modes:
      - current: current conditions, used for the live frost cutoff
      - forecast: 5-day / 3-hour forecast, used for purge warnings

    The Shelly script locally handles physical-input locking, forced frost
    shutdown, purge-state invalidation, automatic shutdown, and maximum-runtime
    protection.
  domain: automation
  input:
    current_weather_entity:
      name: OpenWeatherMap current weather
      description: >
        Weather entity from an OpenWeatherMap integration configured in
        Free "current" mode.
      selector:
        entity:
          filter:
            - domain: weather
              integration: openweathermap

    forecast_weather_entity:
      name: OpenWeatherMap forecast weather
      description: >
        Weather entity from a separate OpenWeatherMap integration configured in
        Free "forecast" mode (5 days, 3-hour steps).
      selector:
        entity:
          filter:
            - domain: weather
              integration: openweathermap

    shelly_device:
      name: Shelly Plus 1PM
      description: Shelly Plus 1PM running shelly/pump_protection.js.
      selector:
        device:
          integration: shelly

    pump_switch_entity:
      name: Pump switch
      description: Switch entity that controls the Shelly pump relay.
      selector:
        entity:
          filter:
            - domain: switch
              integration: shelly

    pump_button_entities:
      name: Additional pump buttons
      description: >
        Optional start/stop button entities. Each press stops the pump when it
        is on, or starts it when it is off. Starts are ignored while frost
        protection is active. Button helpers, device button entities, and
        binary-sensor push buttons are supported. Binary sensors act on the
        off-to-on press only.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: input_button
            - domain: button
            - domain: binary_sensor

    pump_status_led_entities:
      name: Pump status LEDs
      description: >
        Optional light or switch entities used as status LEDs. They are on
        while the pump relay is powered and off while it is not powered. If a
        button tries to start the pump during frost lock, they flash three
        times.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: light
            - domain: switch

    frost_lock_helper:
      name: Frost lock helper
      description: >
        Input boolean used to expose the Shelly frost-lock state to Home
        Assistant dashboards. Create a Toggle helper and select it here.
      selector:
        entity:
          filter:
            - domain: input_boolean

    line_purged_helper:
      name: Water lines purged helper
      description: >
        Input boolean used to mirror the Shelly line_purged state for Home
        Assistant dashboards. Create a Toggle helper and select it here.
      selector:
        entity:
          filter:
            - domain: input_boolean

    temperature_threshold:
      name: Frost cutoff
      description: Frost lock activates below this current outdoor temperature.
      default: 4
      selector:
        number:
          min: -20
          max: 20
          step: 0.5
          unit_of_measurement: "°C"
          mode: box

    hysteresis:
      name: Frost hysteresis
      description: >
        Once locked, the pump unlocks at cutoff + hysteresis.
        With defaults it locks below 4 °C and unlocks at 5 °C.
      default: 1
      selector:
        number:
          min: 0
          max: 10
          step: 0.5
          unit_of_measurement: "°C"
          mode: box

    automatic_shutdown_threshold:
      name: Automatic shutdown threshold
      description: >
        While the relay is on, sustained consumption below this value starts
        the local Shelly automatic-shutdown timer. This stops the pump once it
        is no longer drawing the power associated with useful pumping.
      default: 10
      selector:
        number:
          min: 0
          max: 500
          step: 1
          unit_of_measurement: "W"
          mode: box

    automatic_shutdown_duration:
      name: Automatic shutdown delay
      description: >
        Continuous time below the automatic shutdown threshold before the
        Shelly turns the pump off. Any recovery above the threshold resets the
        timer.
      default: 15
      selector:
        number:
          min: 1
          max: 120
          step: 1
          unit_of_measurement: "min"
          mode: box

    maximum_runtime:
      name: Maximum runtime
      description: >
        Hard limit for one continuous relay-on period. This timer uses only
        the relay state and does not depend on measured power or actual water
        flow. The Shelly turns the relay off when the limit is reached.
      default: 30
      selector:
        number:
          min: 1
          max: 2880
          step: 1
          unit_of_measurement: "min"
          mode: box

    forecast_hours:
      name: Purge warning look-ahead
      description: >
        Warn when the OpenWeatherMap forecast reaches below the frost cutoff
        within this many hours.
      default: 24
      selector:
        number:
          min: 3
          max: 120
          step: 3
          unit_of_measurement: "h"
          mode: box

    notification_targets:
      name: Notification targets
      description: >
        Notify entities for all users who should receive the purge warning.
        A Notify Group is recommended.
      selector:
        entity:
          multiple: true
          filter:
            - domain: notify

variables:
  current_weather_entity: !input current_weather_entity
  forecast_weather_entity: !input forecast_weather_entity
  pump_switch_entity: !input pump_switch_entity
  pump_status_led_entities: !input pump_status_led_entities

  temperature_threshold: !input temperature_threshold
  hysteresis: !input hysteresis
  automatic_shutdown_threshold: !input automatic_shutdown_threshold
  automatic_shutdown_duration: !input automatic_shutdown_duration
  maximum_runtime: !input maximum_runtime
  forecast_hours: !input forecast_hours

  current_temperature: >
    {{ state_attr(current_weather_entity, 'temperature') }}

  unlock_temperature: >
    {{
      (temperature_threshold | float)
      + (hysteresis | float)
    }}

triggers:
  # Optional HA buttons provide additional pump controls.
  - trigger: state
    entity_id: !input pump_button_entities
    id: pump_button

  # Keep optional status LEDs synchronized with the actual relay state.
  - trigger: state
    entity_id: !input pump_switch_entity
    id: pump_state

  # Current OWM updates are the primary frost-lock trigger.
  - trigger: state
    entity_id: !input current_weather_entity
    id: current_weather

  # Forecast entity updates can trigger an immediate purge check.
  - trigger: state
    entity_id: !input forecast_weather_entity
    id: forecast_weather

  # Restore/synchronize state after HA starts.
  - trigger: homeassistant
    event: start
    id: startup

  # Reconcile configuration and frost state even if an update was missed.
  - trigger: time_pattern
    minutes: "/5"
    id: reconcile

  # Repeat an outstanding purge warning at a deliberately low frequency.
  - trigger: time_pattern
    hours: "/6"
    minutes: "0"
    id: forecast_reminder

conditions:
  # A binary sensor reports both press and release. Only the press may toggle
  # the pump; reject the release before it can restart an LED flash sequence.
  - condition: template
    value_template: >
      {{
        trigger is not defined
        or trigger.id != 'pump_button'
        or (
          trigger.from_state is not none
          and trigger.to_state is not none
          and trigger.from_state.state not in ['unknown', 'unavailable']
          and trigger.to_state.state not in ['unknown', 'unavailable']
          and trigger.from_state.state != trigger.to_state.state
          and (
            not trigger.entity_id.startswith('binary_sensor.')
            or (
              trigger.from_state.state == 'off'
              and trigger.to_state.state == 'on'
            )
          )
        )
      }}

actions:
  # -------------------------------------------------------------------------
  # Synchronize the complete configuration object to Shelly KVS.
  # -------------------------------------------------------------------------
  - action: shelly.set_kvs_value
    data:
      device_id: !input shelly_device
      key: pump_config
      value: >
        {{
          {
            "cutoff_c": temperature_threshold | float,
            "hysteresis_c": hysteresis | float,
            "automatic_shutdown_w": automatic_shutdown_threshold | float,
            "automatic_shutdown_seconds":
              (automatic_shutdown_duration | float * 60) | int,
            "maximum_runtime_seconds": (maximum_runtime | float * 60) | int
          }
        }}

  # -------------------------------------------------------------------------
  # Current-weather frost lock with one-sided hysteresis.
  #
  # T < cutoff:
  #   lock
  #
  # cutoff <= T < cutoff + hysteresis:
  #   preserve previous Shelly frost_lock value
  #
  # T >= cutoff + hysteresis:
  #   unlock
  #
  # unavailable/non-numeric current weather:
  #   fail safe -> lock
  # -------------------------------------------------------------------------
  - choose:
      - conditions:
          - condition: template
            value_template: >
              {{
                is_number(current_temperature)
                and (current_temperature | float)
                  < (temperature_threshold | float)
              }}
        sequence:
          - action: shelly.set_kvs_value
            data:
              device_id: !input shelly_device
              key: frost_lock
              value: true

      - conditions:
          - condition: template
            value_template: >
              {{
                is_number(current_temperature)
                and (current_temperature | float)
                  >= (unlock_temperature | float)
              }}
        sequence:
          - action: shelly.set_kvs_value
            data:
              device_id: !input shelly_device
              key: frost_lock
              value: false

    default:
      - if:
          - condition: template
            value_template: >
              {{ not is_number(current_temperature) }}
        then:
          - action: shelly.set_kvs_value
            data:
              device_id: !input shelly_device
              key: frost_lock
              value: true

  # Mirror the authoritative KVS state into an HA entity for dashboards. This
  # also preserves the existing state correctly while temperature is inside
  # the hysteresis band. Missing/unreadable state is shown as locked.
  - action: shelly.get_kvs_value
    data:
      device_id: !input shelly_device
      key: frost_lock
    response_variable: frost_state

  - choose:
      - conditions:
          - condition: template
            value_template: >
              {{ (frost_state.value | default(true) | bool) == false }}
        sequence:
          - action: input_boolean.turn_off
            target:
              entity_id: !input frost_lock_helper
    default:
      - action: input_boolean.turn_on
        target:
          entity_id: !input frost_lock_helper

  # Mirror the purge state for dashboard visibility. The purge script updates
  # this helper immediately; reconciliation recovers Shelly-side changes.
  - action: shelly.get_kvs_value
    data:
      device_id: !input shelly_device
      key: line_purged
    response_variable: purge_state

  - choose:
      - conditions:
          - condition: template
            value_template: >
              {{ purge_state.value | default(false) | bool }}
        sequence:
          - action: input_boolean.turn_on
            target:
              entity_id: !input line_purged_helper
    default:
      - action: input_boolean.turn_off
        target:
          entity_id: !input line_purged_helper

  # -------------------------------------------------------------------------
  # Optional additional controls and pump-powered status LEDs.
  # -------------------------------------------------------------------------
  - choose:
      - conditions:
          - condition: trigger
            id: pump_button
        sequence:
          - if:
              - condition: template
                value_template: "{{ is_state(pump_switch_entity, 'on') }}"
            then:
              - action: switch.turn_off
                target:
                  entity_id: !input pump_switch_entity
            else:
              - if:
                  - condition: state
                    entity_id: !input frost_lock_helper
                    state: "off"
                then:
                  - action: switch.turn_on
                    target:
                      entity_id: !input pump_switch_entity
                else:
                  - if:
                      - condition: template
                        value_template: >
                          {{ pump_status_led_entities | length > 0 }}
                    then:
                      - repeat:
                          count: 3
                          sequence:
                            - action: homeassistant.turn_on
                              target:
                                entity_id: !input pump_status_led_entities
                            - delay:
                                milliseconds: 300
                            - action: homeassistant.turn_off
                              target:
                                entity_id: !input pump_status_led_entities
                            - delay:
                                milliseconds: 300

  - if:
      - condition: template
        value_template: "{{ pump_status_led_entities | length > 0 }}"
    then:
      - if:
          - condition: template
            value_template: "{{ is_state(pump_switch_entity, 'on') }}"
        then:
          - action: homeassistant.turn_on
            target:
              entity_id: !input pump_status_led_entities
        else:
          - action: homeassistant.turn_off
            target:
              entity_id: !input pump_status_led_entities

  # -------------------------------------------------------------------------
  # Forecast purge warning.
  #
  # Check on forecast updates, startup, and every six hours. Reconciliation
  # itself does not send a warning, avoiding a notification every 5 minutes.
  # -------------------------------------------------------------------------
  - if:
      - condition: trigger
        id:
          - forecast_weather
          - startup
          - forecast_reminder
    then:
      - action: weather.get_forecasts
        target:
          entity_id: !input forecast_weather_entity
        data:
          type: hourly
        response_variable: weather_forecast

      - variables:
          lines_purged: >
            {{ purge_state.value | default(false) | bool }}

          forecast_entries: >
            {{
              weather_forecast[forecast_weather_entity]['forecast']
              if forecast_weather_entity in weather_forecast
              else []
            }}

          cutoff_forecast: >
            {% set ns = namespace(found=false) %}
            {% set limit = now() + timedelta(hours=forecast_hours | int) %}
            {% for item in forecast_entries %}
              {% set timestamp = as_datetime(item.datetime, default=none) %}
              {% if
                timestamp is not none
                and timestamp >= now()
                and timestamp <= limit
                and item.temperature is defined
                and is_number(item.temperature)
                and (item.temperature | float)
                  < (temperature_threshold | float)
              %}
                {% set ns.found = true %}
              {% endif %}
            {% endfor %}
            {{ ns.found }}

          forecast_minimum: >
            {% set ns = namespace(temps=[]) %}
            {% set limit = now() + timedelta(hours=forecast_hours | int) %}
            {% for item in forecast_entries %}
              {% set timestamp = as_datetime(item.datetime, default=none) %}
              {% if
                timestamp is not none
                and timestamp >= now()
                and timestamp <= limit
                and item.temperature is defined
                and is_number(item.temperature)
              %}
                {% set ns.temps = ns.temps + [item.temperature | float] %}
              {% endif %}
            {% endfor %}
            {{
              (ns.temps | min)
              if ns.temps | length > 0
              else none
            }}

      - if:
          - condition: template
            value_template: >
              {{
                (cutoff_forecast | bool)
                and not (lines_purged | bool)
              }}
        then:
          - action: notify.send_message
            target:
              entity_id: !input notification_targets
            data:
              message: >
                Water lines need purging. OpenWeatherMap predicts a temperature
                below {{ temperature_threshold }} °C within the next
                {{ forecast_hours }} hours.
                {% if forecast_minimum is not none %}
                Forecast minimum: {{ forecast_minimum | round(1) }} °C.
                {% endif %}
                The Shelly currently reports the lines as NOT PURGED.
                Turn the pump off, purge the lines manually, then run the
                "Mark water lines purged" Home Assistant script.

mode: restart
max_exceeded: silent
